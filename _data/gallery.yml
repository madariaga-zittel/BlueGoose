- file: /assets/images/archive/516077148_24875825125336410_4134459348876938550_n.jpg
  title: John Ferguson Jr., was a welder on the USS Honolulu.
  description: John Ferguson Jr., was a welder on the USS Honolulu. He served on the ship during the time it was in the Aleutians
    through Leyte Gulf. As a matter of fact, he was one of the welders that helped keep the ship afloat when it lost over
    70 feet of its bow! John's nickname was "Hotshot" prior to enlisting, and this nickname may have stuck while in the navy.
    As we know, the men were assigned many positions and chores on the ship - aside from being a welder, John worked in the
    boiler room and reloaded the anti-aircraft guns John "Hotshot" Ferguson, Jr., (on the left, with unidentified sailor)
  category: damage
  archive_id: 516077148_24875825125336410_4134459348876938550_n
