---
layout: default
title: Gallery
---
<section class="page-hero gallery-hero"><div class="shell"><p class="eyebrow">Historic photograph archive</p><h1>Gallery</h1><p>Explore construction, shipboard life, wartime service, battle damage, and family photographs.</p></div></section><section class="paper-section"><div class="shell"><div class="filter-row" role="group" aria-label="Gallery filters"><button class="filter active" data-filter="all">All</button><button class="filter" data-filter="ship">The ship</button><button class="filter" data-filter="construction">Construction</button><button class="filter" data-filter="crew">Crew</button><button class="filter" data-filter="snowie">Snowie</button><button class="filter" data-filter="damage">Damage & repair</button><button class="filter" data-filter="wartime">Wartime</button><button class="filter" data-filter="archive">Archive</button></div><div class="gallery-grid">{% for photo in site.data.gallery %}<button class="gallery-item" data-category="{{ photo.category }}" data-full="{{ photo.file | relative_url }}" data-title="{{ photo.title | escape }}" data-description="{{ photo.description | default: photo.title | escape }}"><img loading="lazy" src="{{ photo.file | relative_url }}" alt="{{ photo.title }}"><span><strong>{{ photo.title }}</strong>{% if photo.description %}<small>{{ photo.description }}</small>{% endif %}</span></button>{% endfor %}</div></div></section>
